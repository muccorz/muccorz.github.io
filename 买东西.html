<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>买东西</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif; line-height: 1.6; margin: 0; padding: 24px; max-width: 820px; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    h2 { margin: 22px 0 10px; font-size: 20px; }
    .card { border: 1px solid rgba(127,127,127,.25); border-radius: 14px; padding: 16px; }
    ul { padding-left: 18px; margin: 8px 0; }
    li { margin: 10px 0; }
    label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; user-select: none; }
    input[type="checkbox"] { width: 20px; height: 20px; margin-top: 2px; cursor: pointer; }
    .done { opacity: .55; text-decoration: line-through; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button { border: 1px solid rgba(127,127,127,.35); background: transparent; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    button:active { transform: translateY(1px); }
    .note { opacity: .7; font-size: 12px; margin-top: 10px; }
    .menu p { margin: 6px 0; }
  </style>
</head>
<body>
  <h1>买东西</h1>

  <div class="card menu">
    <p>那个干锅土豆片挺好吃的来一个</p>
    <p>虾滑堡来一个</p>
    <p>葱烧豆腐</p>
    <p>梅菜扣肉（硬五花</p>
    <p>大碗豆腐</p>
    <p>牛肉炖萝卜（柱候酱（牛肋条</p>
    <p>溜肉段（梅花肉</p>
    <p>拔丝地瓜</p>
    <p>一个汤</p>
  </div>

  <h2>还得买：</h2>

  <div class="card">
    <ul id="todo">
      <li><label><input type="checkbox" data-key="todo-0" /><span>硬五花（猪</span></label></li>
      <li><label><input type="checkbox" data-key="todo-1" /><span>牛肋条</span></label></li>
      <li><label><input type="checkbox" data-key="todo-2" /><span>梅花肉（猪</span></label></li>
      <li><label><input type="checkbox" data-key="todo-3" /><span>香菜</span></label></li>
      <li><label><input type="checkbox" data-key="todo-4" /><span>娃娃菜（散装白菜 一点点 给虾滑煲垫底的</span></label></li>
      <li><label><input type="checkbox" data-key="todo-5" /><span>金针菇（同上</span></label></li>
      <li><label><input type="checkbox" data-key="todo-6" /><span>青椒（溜肉段</span></label></li>
      <li><label><input type="checkbox" data-key="todo-7" /><span>小辣椒（虾滑粉丝</span></label></li>
      <li><label><input type="checkbox" data-key="todo-8" /><span>地瓜（两个</span></label></li>
      <li><label><input type="checkbox" data-key="todo-9" /><span>炸东西的抄网有的话买一个</span></label></li>
      <li><label><input type="checkbox" data-key="todo-9" /><span>盘子4个</span></label></li>
      <li><label><input type="checkbox" data-key="todo-10" /><span>中国猪</span></label></li>
      <li><label><input type="checkbox" data-key="todo-11" /><span>奶茶</span></label></li>
    </ul>

    <div class="actions">
      <button id="checkAll" type="button">全勾</button>
      <button id="uncheckAll" type="button">全清</button>
      <button id="clearSaved" type="button">清空已保存状态</button>
    </div>

    <div class="note">勾选状态保存在当前浏览器（localStorage），换设备/换浏览器不会同步。</div>
  </div>

  <script>
    const list = document.getElementById('todo');
    const items = Array.from(list.querySelectorAll('input[type="checkbox"]'));

    function setDoneClass(cb) {
      const span = cb.closest('label')?.querySelector('span');
      if (!span) return;
      span.classList.toggle('done', cb.checked);
    }

    function load() {
      items.forEach(cb => {
        const key = cb.dataset.key;
        cb.checked = localStorage.getItem(key) === '1';
        setDoneClass(cb);
      });
    }

    function save(cb) {
      const key = cb.dataset.key;
      localStorage.setItem(key, cb.checked ? '1' : '0');
      setDoneClass(cb);
    }

    // change 触发保存
    items.forEach(cb => cb.addEventListener('change', () => save(cb)));

    // 按钮
    document.getElementById('checkAll').addEventListener('click', () => {
      items.forEach(cb => { cb.checked = true; save(cb); });
    });

    document.getElementById('uncheckAll').addEventListener('click', () => {
      items.forEach(cb => { cb.checked = false; save(cb); });
    });

    document.getElementById('clearSaved').addEventListener('click', () => {
      items.forEach(cb => localStorage.removeItem(cb.dataset.key));
      load();
    });

    load();
  </script>
</body>
</html>
